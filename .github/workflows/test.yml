name: Test Project
on: push
jobs: 
  test:
     runs-on: ubuntu-latest
     steps:
       - name: Get code
         uses: actions/checkout@v3
       - name: Install Nodejs
         uses: actions/setup-node@v3
         with:
           node-version: 18
       - name: Install Dependendies
         run: npm ci
       - name: RUN tests
         run: npm test